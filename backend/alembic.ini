# alembic.ini — Alembic configuration file
# Run: alembic upgrade head

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration file names
# %%(rev)s — revision id   %%(slug)s — short summary
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# sys.path prepend — blank means project root
prepend_sys_path = .

# timezone for generated file timestamps
timezone = UTC

# max length of slug in auto-generated filenames
truncate_slug_length = 40

# version path separator
version_path_separator = os

# DATABASE_URL is loaded by env.py from the app config — leave this blank
sqlalchemy.url =

[post_write_hooks]
# Optional: format generated files with ruff
# hooks = ruff
# ruff.type = console_scripts
# ruff.entrypoint = ruff
# ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
