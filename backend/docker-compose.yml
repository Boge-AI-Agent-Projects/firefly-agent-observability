services:
  db:
    image: postgres:16-alpine
    container_name: firefly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: firefly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
      POSTGRES_DB: firefly
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firefly -d firefly"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: firefly-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://firefly:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}@db:5432/firefly
      INGEST_API_KEY: ${INGEST_API_KEY:?Set INGEST_API_KEY in backend/.env}
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./app:/app/app   # hot-reload in dev

volumes:
  pgdata:
